<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>My Image Gallery</h1>
      <p>Explore My Image collection</p>
    </header>

    <div class="filter_btns">
      <button data-filter="all">All</button>
      <button data-filter="city">City</button>
      <button data-filter="nature">Nature</button>
      <button data-filter="animals">Animals</button>
    </div>

    <section class="image_gallery">
      <div class="gallery-item" data-category="nature">
        <img src="https://picsum.photos/id/10/600/400" alt="Nature Image" />
      </div>

      <div class="gallery-item" data-category="city">
        <img src="https://picsum.photos/id/15/600/400" alt="City Image" />
      </div>

      <div class="gallery-item" data-category="animals">
        <img src="https://picsum.photos/id/237/600/400" alt="Dog Image" />
      </div>

      <div class="gallery-item" data-category="nature">
        <img src="https://picsum.photos/id/28/600/400" alt="Nature Image" />
      </div>

      <div class="gallery-item" data-category="city">
        <img src="https://picsum.photos/id/42/600/400" alt="City Image" />
      </div>

      <div class="gallery-item" data-category="animals">
        <img src="https://picsum.photos/id/1025/600/400" alt="Dog Image" />
      </div>
    </section>

    <div class="lightbox">
      <button class="close">&times;</button>
      <button class="prev">&#10094;</button>
      <img class="lightbox-image" src="" alt="" />
      <button class="next">&#10095;</button>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
